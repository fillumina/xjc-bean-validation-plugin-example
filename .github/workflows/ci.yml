# Runs the example on every push and pull request, and once a night against the latest commit of
# the project it imports. The example pins the released version, the one a reader resolves from
# Central, but the clone is built at whatever version the plugin carries now, so the build step is
# told which one that was. Without it a nightly run would quietly test the release instead.

name: CI

on:
  push:
  pull_request:
  schedule:
    # a few minutes past four, so a nightly run does not queue with everything else on the hour
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install the plugin from its latest commit
      id: plugin
      run: |
        git clone --depth 1 https://github.com/fillumina/xjc-bean-validation-plugin
        mvn -B -DskipTests install --file xjc-bean-validation-plugin/pom.xml
        echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout --file xjc-bean-validation-plugin/pom.xml)" >> "$GITHUB_OUTPUT"

    - name: Build and test the example
      run: mvn -B verify --file pom.xml -Dxjc-bean-validation-plugin.version=${{ steps.plugin.outputs.version }}
