# Runs the example on every push and pull request, and once a night against the latest commit of
# the project it imports. The plugin is not released yet, so its snapshot exists nowhere else, and
# what this example has to prove is that the current sources work inside a real build.

name: CI

on:
  push:
  pull_request:
  schedule:
    # a few minutes past four, so a nightly run does not queue with everything else on the hour
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install the plugin from its latest commit
      run: |
        git clone --depth 1 https://github.com/fillumina/xjc-bean-validation-plugin
        mvn -B -DskipTests install --file xjc-bean-validation-plugin/pom.xml

    - name: Build and test the example
      run: mvn -B verify --file pom.xml
